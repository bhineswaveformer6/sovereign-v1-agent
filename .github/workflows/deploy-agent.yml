name: Sovereign V1 Agent — Issue Analyzer

on:
  issues:
      types: [opened, labeled]  issue_comment:
          types: [created]
            workflow_dispatch:
                inputs:
                      issue_number:
                              description: 'Issue number to analyze'
                                      required: false
                                              type: string

                                              permissions:
                                                issues: write
                                                  contents: read

                                                  jobs:
                                                    analyze-issue:
                                                        runs-on: ubuntu-latest
                                                            if: |
                                                                  github.event_name == 'workflow_dispatch' ||
                                                                        (github.event_name == 'issues' && contains(github.event.issue.labels.*.name, 'needs-audit')) ||
                                                                              (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/audit'))

                                                                                  steps:
                                                                                        - name: Checkout Repository
                                                                                                uses: actions/checkout@v4

                                                                                                      - name: Set up Python 3.11
                                                                                                              uses: actions/setup-python@v5
                                                                                                                      with:
                                                                                                                                python-version: '3.11'
                                                                                                                                          cache: 'pip'
                                                                                                                                          
                                                                                                                                                - name: Install Dependencies
                                                                                                                                                        run: pip install -r requirements.txt
                                                                                                                                                        
                                                                                                                                                              - name: Run Sovereign V1 Agent
                                                                                                                                                                      env:
                                                                                                                                                                                GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                                                                                                                                                                                          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
                                                                                                                                                                                                    REPO_OWNER: ${{ github.repository_owner }}
                                                                                                                                                                                                              REPO_NAME: ${{ github.event.repository.name }}
                                                                                                                                                                                                                        ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
                                                                                                                                                                                                                                run: |
                                                                                                                                                                                                                                          python src/update_agent.py
                                                                                                                                                                                                                                          
                                                                                                                                                                                                                                                - name: Upload Agent Report
                                                                                                                                                                                                                                                        if: always()
                                                                                                                                                                                                                                                                uses: actions/upload-artifact@v4
                                                                                                                                                                                                                                                                        with:
                                                                                                                                                                                                                                                                                  name: agent-analysis-report
                                                                                                                                                                                                                                                                                            path: reports/
                                                                                                                                                                                                                                                                                                      retention-days: 30
